[package]
edition = "2024"
name = "smux_v1"
version = "0.1.0"

description = "流复用协议第一版"

[dependencies]
abs_async_iter = { git = "https://gitee.com/lino_snsalias/abs_async_iter.git" }
abs_buff = { git = "https://gitee.com/lino_snsalias/abs_buff.git", branch = "dev/0.3.0" }

crc = { version = "3.4.*" }

[dev-dependencies]
# 测试在 compio 上运行（目标 3），因此运行时桥接、环形缓冲与内存分配器都只
# 在 dev-dependencies 中出现。
abs_art-bridge = { version = "0.2.2", default-features = false, features = ["backend-compio"] }
buffex = { git = "https://gitee.com/lino_snsalias/buffex.git", branch = "dev/0.3.0" }
compio = { version = "0.19.*", features = ["fs", "macros", "time"] }
mm_ptr = { git = "https://gitee.com/lino_snsalias/mm_ptr.git", branch = "dev/0.1.3" }
