[package]
edition = "2024"
name = "smux_v1"
version = "0.1.0"

description = "流复用协议第一版"

[dependencies]
# 【本地 spike，未提交】`abs_art` 家族改用**本地路径**依赖，以便试用
# `feat/time` 分支新增的计时能力（`TrTime`）。正式落地时应当改回 git tag/branch。
abs_art = { path = "../abs_art/abs_art" }
# 示例与下游可能直接用**后端 crate 自己的**运行时类型（`abs_art_tokio::Runtime` 等），
# 而不是 bridge 的具名别名——两者是同一个类型，但只有当对应 feature 打开时别名才存在。
# 因此这里无条件依赖两个后端，供「显式挑后端」的用例使用（bridge 已把它们作为
# 传递依赖拉进来，这里只是把类型路径变短）。
abs_art-tokio = { path = "../abs_art/abs_art-tokio" }
abs_art-compio = { path = "../abs_art/abs_art-compio" }
# **桥接 crate**：业务库只依赖它就能拿到运行时值（`Runtime` / `current`）与本地
# 作用域（`LocalScope`），而不直接按后端写代码——后端由 `Cargo.toml` 的 feature
# 选定（见下方 `[features]` 的说明）。
#
# 缺省后端 = **compio**（bridge 的 `default = ["default-backend-compio"]`）。
# 注意 bridge 的守卫：**同时启用多个 backend** 时必须显式声明 `default-backend-*`，
# 否则裸名 `Runtime` 没有唯一解，直接编译失败——因此本仓不启用 bridge 的裸名，
# 而是在 `connection/scope_host_.rs` 里用**具名别名**（`CompioRuntime` /
# `TokioRuntime`）配合自己的 feature 二选一。
abs_art-bridge = { path = "../abs_art/abs_art-bridge" }
# 虚拟时间（仅测试装配需要）：连接的建连路径要自己取作用域（`ScopeHost`），而
# `ManualTime` 是外部类型，它的 `ScopeHost` 实现只能写在**拥有该 trait 的本 crate**
# 里（孤儿规则）。因此这里开一个可选依赖 + 测试 feature，生产依赖图里不出现它。
abs_art-mock_clock = { path = "../abs_art/abs_art-mock_clock", optional = true }
abs_async_iter = { git = "https://gitee.com/lino_snsalias/abs_async_iter.git" }
abs_smux = { git = "https://gitee.com/lino_snsalias/abs_smux.git", branch = "dev/0.1.0" }
# abs_smux = { path = "../abs_smux" }
atomic_sync = { git = "https://gitee.com/lino_snsalias/atomic_sync.git", branch = "dev/0.3.0" }

# 复用子流与协议帧的缓冲区一律使用 `buffex::circular_buff`，因此它是正式依赖
# 而非测试专用依赖（`no_std` 成立；缺省分配器由 `buffex` 重导出）。
buffex = { git = "https://gitee.com/lino_snsalias/buffex.git", branch = "dev/0.3.0" }
mm_ptr = { git = "https://gitee.com/lino_snsalias/mm_ptr.git", branch = "dev/0.2.0" }

crc = { version = "3.4.*" }
flume = { version = "0.12.*" }
thiserror = { version = "2.0.*", default-features = false }

[features]
# **后端选择**（经 `abs_art-bridge`）：缺省 = compio；`test-tokio-runtime` 把它换成
# tokio（用于在 tokio 装配下再跑一遍同一批场景）。
#
# 为什么不用 bridge 的裸名 `Runtime`：bridge 的守卫要求「同时启用多个 backend 时
# 必须显式声明 default-backend-*」，而这里两个后端会同时出现在 `cargo test` 的
# feature 并集里；用了裸名就会踩那条守卫（或更糟：按优先级悄悄选中一个）。
# 因此 smux 侧用**具名别名**（`CompioRuntime` / `TokioRuntime`）二选一，
# 见 `src/connection/scope_host_.rs`。
test-tokio-runtime = ["abs_art-bridge/backend-tokio", "test-mock-clock"]
# compio 侧：与 tokio feature 构成**互斥二选一**（共享文件按「compio feature 是否
# 打开」分派设备类型）。两个都在缺省集里：这样 `cargo test --all-targets` 不带任何
# 参数就能把两个冒烟 target 各按自己的运行时编译一遍，与改动前 `smoke_tokio.rs` +
# `smoke_compio.rs` 两个文件各自运行的效果一致；单独跑某一个 target 时用
# `--no-default-features --features <该侧>` 即可。
test-compio-runtime = ["abs_art-bridge/backend-compio", "test-mock-clock"]
# 虚拟时钟（`abs_art_mock_clock`）只在这两个测试 feature 下被拉进来。
test-mock-clock = ["dep:abs_art-mock_clock"]
default = ["test-compio-runtime"]

[dev-dependencies]
# 测试在 compio 上运行（目标 3），因此内存分配器只在 dev-dependencies 中出现
# （`buffex` 已是正式依赖，不在此重复）。
# 注意：`abs_art-bridge` **不在这里**——它已是正式依赖（见上），Cargo 不允许同一个
# 依赖有两个来源（path 与 registry 混用会直接拒绝解析 manifest）。

# 集成冒烟测试（tests/）用两个运行时各跑一遍同一场景，且都跑真实 UNIX socket：
# - 两个运行时都用「调用方驱动的泵 + 全被动 buffex 环」搬运 socket 数据；
# - tokio 侧用 `abs_buff_tokio_adapt` 的设备适配，compio 侧用
#   `abs_buff_compio_adapt` 的设备适配（原因与三处阻塞点见 dev-notes §9）。
buffex_tokio_adapt = { git = "https://gitee.com/lino_snsalias/buffex_tokio_adapt.git" }
buffex_compio_adapt = { git = "https://gitee.com/lino_snsalias/buffex_compio_adapt.git" }

# 连接层经 `abs_art` 的**值化本地作用域**（`TrLocalScope`）投递读 / 写循环，
# 并从一个**运行时值**（`abs_art::TrTime`：计时 + 时刻）取时间能力。因此测试要给出
# 具体的后端值：tokio 版用 `abs_art_tokio::current()` + 它交出的 `LocalScope`，
# compio 版同理。两者从与 `abs_art` 同一个源取，保证 trait 是同一份。
# 【本地 spike，未提交】同 `abs_art`：改本地路径，保证两边用的是同一份
# `TrLocalScope` / `TrTime` trait（否则两个 abs_art 版本会让 trait 对不上）。
#
# `mock-clock`：各后端的手动时钟驱动入口（`LocalScope::block_on_advancing`）。
# keepalive 的端到端验收靠它把「等 1 秒 / 2.5 秒」变成**虚拟时间**，
# 场景本体与设计见 `tests/keepalive_common.inc` 与 `dev-notes/runtime-adoption-20261006-1352.md`。
abs_art-tokio = { path = "../abs_art/abs_art-tokio", features = ["mock-clock"] }
abs_art-compio = { path = "../abs_art/abs_art-compio", features = ["mock-clock"] }

# 手动（虚拟）时钟本体：`ManualClock` / `ManualTime` / `Supervisor`。
# 它只出现在测试里（正式依赖不需要），因此留在 dev-dependencies。
abs_art-mock_clock = { path = "../abs_art/abs_art-mock_clock" }

# 场景并发用与运行时无关的组合子（join! / join_all / select），因此只需要
# `futures`，不需要为两个运行时各写一份并发代码。
futures = "0.3.*"
compio = { version = "0.19.*", features = ["fs", "macros", "time", "net", "runtime"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

# 冒烟测试的两个 target：**同一份场景**（`tests/smoke_common.inc`）在两个运行时下各
# 跑一遍，`required-features` 决定每个 target 用哪一套 socket / 适配类型。
[[test]]
name = "smoke_tokio"
path = "tests/smoke_tokio.rs"
required-features = ["test-tokio-runtime"]

[[test]]
name = "smoke_compio"
path = "tests/smoke_compio.rs"
required-features = ["test-compio-runtime"]

# 保活 / 空闲超时的端到端验收：两个薄壳共用 `tests/keepalive_common.inc`。
# 与冒烟 target 分开的同一条理由：这两个场景要真实时间，而计时循环必须跑在**真正支持
# 计时**的后端上（tokio 与 compio 的作用域是两个不同类型，无法在同一测试进程里互换）。
[[test]]
name = "keepalive"
path = "tests/keepalive.rs"
required-features = ["test-tokio-runtime"]

[[test]]
name = "keepalive_compio"
path = "tests/keepalive_compio.rs"
required-features = ["test-compio-runtime"]
